services:
  - type: web
    name: opensite-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/main.py --server.port $PORT --server.address 0.0.0.0 --server.enableCORS false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: HINDSIGHT_BASE_URL
        value: https://api.hindsight.vectorize.io
      - key: GROQ_MODEL
        value: qwen/qwen3-32b

  - type: web
    name: opensite-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
